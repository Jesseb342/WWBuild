name: Build SquirrelPad IPA

# Same structure as the working "Build BlueWake IPA" workflow:
# whole checkout cached in RUNNER_TEMP, restored by the newest "sq-build-" key,
# build stopped by a time-limit watchdog, cache saved with always().
# Keep this repo PRIVATE: the cache and IPA contain code translated from your ROM.
#
# Run it with minutes=15 first as a test, then with 320 for real, and run it
# again after each stop until it says "Build finished successfully".

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Stop the build after this many minutes (15 = test, 320 = real)"
        default: "15"
        required: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    env:
      ROM_DRIVE_ID: "1ZgP1dSW_YGs5EGy-55a0JI-I3-BPw0qR"

    steps:
      - name: Show runner information
        run: |
          sw_vers
          sysctl -n hw.ncpu
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          xcodebuild -version
          df -h /

      - name: Download Conker ROM from Google Drive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/conker"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet gdown
          ROM="$RUNNER_TEMP/conker/conker-us.z64"
          for i in 1 2 3 4; do
            rm -f "$ROM"
            if "$RUNNER_TEMP/venv/bin/gdown" \
                 "https://drive.google.com/uc?id=$ROM_DRIVE_ID" -O "$ROM" \
               && [ "$(stat -f%z "$ROM")" = "67108864" ]; then
              break
            fi
            echo "Download attempt $i failed; retrying in $((i*30))s"
            sleep $((i*30))
          done
          ls -lh "$ROM"
          test "$(stat -f%z "$ROM")" = "67108864"
          test "$(xxd -l 4 -p "$ROM")" = "80371240"
          test "$(shasum -a 1 "$ROM" | cut -d' ' -f1)" = "4cbadd3c4e0729dec46af64ad018050eada4f47a"
          echo "ROM verified"

      - name: Install build tools
        run: |
          brew install cmake ninja pkgconf sdl2 freetype ripgrep || true
          xcodebuild -downloadComponent MetalToolchain || true
          cmake --version
          ninja --version
          rg --version | head -1

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/squirrelpad
          key: sq-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sq-build-

      - name: Cache status
        run: |
          echo "Exact hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Matched key: '${{ steps.cache.outputs.cache-matched-key }}'"
          if [ -d "$RUNNER_TEMP/squirrelpad" ]; then
            du -sh "$RUNNER_TEMP/squirrelpad"
          else
            echo "No restored folder (fresh start)"
          fi

      - name: Clone SquirrelPad
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        run: |
          set -euo pipefail
          git clone https://github.com/chrissotraidis/squirrelpad.git \
            "$RUNNER_TEMP/squirrelpad"

      - name: Show SquirrelPad commit and builder options
        run: |
          cd "$RUNNER_TEMP/squirrelpad"
          git log -1 --format='%H %s'
          python3 scripts/build-personal.py --help || true

      - name: Build IPA (with watchdog)
        id: build
        env:
          LIMIT_MIN: ${{ inputs.minutes }}
        run: |
          set -u
          set -m

          cd "$RUNNER_TEMP/squirrelpad"

          LIMIT=$(( LIMIT_MIN * 60 ))
          echo "Watchdog limit: ${LIMIT_MIN} minutes"

          python3 scripts/build-personal.py \
            --rom "$RUNNER_TEMP/conker/conker-us.z64" \
            --output "$RUNNER_TEMP/SquirrelPad.ipa" &
          BUILD_PID=$!

          (
            sleep "$LIMIT"
            echo "::warning::Time limit reached, stopping build to save cache"
            kill -TERM -- -"$BUILD_PID" 2>/dev/null
            sleep 20
            kill -KILL -- -"$BUILD_PID" 2>/dev/null
            for p in xcodebuild clang clang++ ninja make metal; do
              pkill -KILL -x "$p" 2>/dev/null
            done
          ) &
          WATCHDOG_PID=$!

          (
            while true; do
              sleep 300
              echo "[heartbeat] $(date '+%H:%M:%S') | disk free: $(df -h / | awk 'NR==2{print $4}') | load: $(uptime | sed 's/.*load averages*: //')"
            done
          ) &
          HEARTBEAT_PID=$!

          wait "$BUILD_PID"
          RC=$?
          kill "$WATCHDOG_PID" "$HEARTBEAT_PID" 2>/dev/null

          if [ "$RC" -eq 0 ]; then
            echo "Build finished successfully"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "Build stopped or failed (exit $RC). Cache will be saved; run again to resume."
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Save build cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/squirrelpad
          key: sq-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check IPA
        if: steps.build.outputs.done == 'true'
        run: |
          ls -lh "$RUNNER_TEMP/SquirrelPad.ipa"
          file "$RUNNER_TEMP/SquirrelPad.ipa"
          unzip -l "$RUNNER_TEMP/SquirrelPad.ipa" | head -20
          df -h /

      - name: Upload IPA
        if: steps.build.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SquirrelPad-iOS
          path: ${{ runner.temp }}/SquirrelPad.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Remove ROM
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/conker/conker-us.z64"
