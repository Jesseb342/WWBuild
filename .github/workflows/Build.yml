name: Build Wind Waker Recomp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Show runner information
        run: |
          echo "=== macOS ==="
          sw_vers
          echo "=== CPU ==="
          sysctl -n hw.ncpu
          sysctl -n machdep.cpu.brand_string
          echo "=== Memory ==="
          sysctl -n hw.memsize
          echo "=== Disk ==="
          df -h /

      - name: Download Wind Waker CISO
        env:
          WIND_WAKER_URL: https://drive.usercontent.google.com/download?id=1hXBvvzcUEOYe5NHJKiPpm14TYfnKTEEf&export=download&confirm=t
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/wind-waker"
          cd "$RUNNER_TEMP/wind-waker"

          echo "Downloading Wind Waker CISO..."

          curl -L --fail --retry 3 --retry-all-errors \
            -A "Mozilla/5.0" \
            -o "test build.ciso" \
            "$WIND_WAKER_URL"

          echo "Downloaded file:"
          ls -lh "test build.ciso"
          file "test build.ciso"
          wc -c "test build.ciso"

      - name: Download Wiimms ISO Tools
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/wind-waker"

          echo "Downloading Wiimms ISO Tools..."

          curl -L --fail --retry 3 --retry-all-errors \
            -o wit.tar.gz \
            "https://wit.wiimm.de/download/wit-v3.05a-r8638-mac.tar.gz"

          tar -xzf wit.tar.gz

          WIT_DIR="$(find . -maxdepth 1 -type d -name 'wit-*' -print -quit)"

          if [ -z "$WIT_DIR" ]; then
            echo "::error::Wiimms ISO Tools directory was not found."
            exit 1
          fi

          chmod +x "$WIT_DIR/bin/wit"

          echo "WIT directory: $WIT_DIR"
          "$WIT_DIR/bin/wit" --version

      - name: Convert CISO to ISO
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/wind-waker"

          WIT_DIR="$(find . -maxdepth 1 -type d -name 'wit-*' -print -quit)"

          echo "Checking CISO..."
          "$WIT_DIR/bin/wit" FILES "test build.ciso"

          echo "Converting CISO to uncompressed ISO..."

          "$WIT_DIR/bin/wit" copy \
            "test build.ciso" \
            --iso \
            -d WindWaker.iso

          echo "Converted ISO:"
          ls -lh WindWaker.iso
          file WindWaker.iso

      - name: Clone Wind Waker Recomp
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/elliotttate/Wind-Waker-Recomp.git \
            "$RUNNER_TEMP/wind-waker-recomp"

      - name: Make builder executable
        run: |
          cd "$RUNNER_TEMP/wind-waker-recomp"
          chmod +x scripts/builder/build.sh

      - name: Build IPA
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/wind-waker-recomp"

          ./scripts/builder/build.sh \
            "$RUNNER_TEMP/wind-waker/WindWaker.iso" \
            --ipa "$RUNNER_TEMP/BlueWake.ipa" \
            --jobs 3 \
            --no-mods \
            --no-train

      - name: Check IPA
        run: |
          echo "=== IPA ==="
          ls -lh "$RUNNER_TEMP/BlueWake.ipa"
          file "$RUNNER_TEMP/BlueWake.ipa"

          echo "=== Disk ==="
          df -h /

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlueWake-iOS
          path: ${{ runner.temp }}/BlueWake.ipa
          if-no-files-found: error
          retention-days: 7
